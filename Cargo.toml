[package]
name = "code-cabal-na"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Sitio estático del guild CODE de CABAL Online NA."
license = "MIT"

[dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0"
leptos = { version = "=0.8.20", features = ["csr"] }
leptos_meta = "=0.8.6"
leptos_router = "=0.8.15"
log = "0.4"
pulldown-cmark = "=0.13.0"
web-sys = { version = "0.3", features = ["Clipboard", "Navigator", "Window"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
